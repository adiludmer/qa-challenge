<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcmeTodo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>AcmeTodo</h1>

        <form id="add-form" class="add-form">
            <input
                id="new-todo"
                type="text"
                placeholder="What needs doing?"
                autocomplete="off"
            >
            <button type="button" id="add-btn">Add</button>
        </form>

        <ul id="todo-list" class="todo-list"></ul>

        <p id="empty-state" class="empty-state" hidden>Nothing to do!</p>

        <footer class="footer">
            <span id="counter" class="counter">0 items left</span>
            <div class="filters">
                <button type="button" data-filter="all" class="filter-btn active">All</button>
                <button type="button" data-filter="active" class="filter-btn">Active</button>
                <button type="button" data-filter="completed" class="filter-btn">Completed</button>
            </div>
            <button type="button" id="clear-completed" class="clear-btn">Clear completed</button>
        </footer>
    </main>

    <script src="app.js"></script>
</body>
</html>
