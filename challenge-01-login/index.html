<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcmePortal — Sign In</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f7;
    margin: 0;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: white;
    padding: 32px;
    border-radius: 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 400px;
    position: relative;
  }
  h1 { margin: 0 0 24px; font-size: 22px; color: #222; }
  label { display: block; margin: 12px 0 6px; font-size: 14px; color: #333; }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
  }
  .remember {
    margin: 16px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .remember label { margin: 0; }
  button {
    width: 100%;
    padding: 12px;
    background: #0066cc;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 15px;
    cursor: pointer;
  }
  button:hover { background: #0052a3; }
  .error {
    position: absolute;
    top: 270px;
    left: -20px;
    width: 360px;
    background: #fee;
    color: #c00;
    padding: 10px 12px;
    border-radius: 4px;
    font-size: 13px;
    border: 1px solid #fcc;
    display: none;
  }
  .success {
    background: #efe;
    color: #060;
    padding: 12px;
    border-radius: 4px;
    margin-top: 12px;
    display: none;
  }
  .hint {
    margin-top: 16px;
    font-size: 12px;
    color: #888;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Sign in to AcmePortal</h1>
    <form id="loginForm" novalidate>
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password">

      <div class="remember">
        <input type="checkbox" id="remember">
        <label for="remember">Remember me</label>
      </div>

      <button type="submit" id="submitBtn">Sign In</button>

      <div class="error" id="errorMsg"></div>
      <div class="success" id="successMsg">Signed in successfully. Redirecting to dashboard…</div>
    </form>
    <div class="hint">Test account: qauser / Test1234!</div>
  </div>

<script>
  const VALID_USER = 'qauser';
  const VALID_PASS = 'Test1234!';
  const MAX_USERNAME_LENGTH = 50;
  const LOCKOUT_THRESHOLD = 5;
  const LOCKOUT_MS = 30000;

  let failedAttempts = 0;
  let lockedUntil = 0;

  const form = document.getElementById('loginForm');
  const usernameEl = document.getElementById('username');
  const passwordEl = document.getElementById('password');
  const rememberEl = document.getElementById('remember');
  const errorEl = document.getElementById('errorMsg');
  const successEl = document.getElementById('successMsg');

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
    successEl.style.display = 'none';
  }
  function clearMessages() {
    errorEl.style.display = 'none';
    successEl.style.display = 'none';
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    clearMessages();

    if (Date.now() < lockedUntil) {
      const sec = Math.ceil((lockedUntil - Date.now()) / 1000);
      showError('Account locked. Try again in ' + sec + ' seconds.');
      return;
    }

    const username = usernameEl.value;
    const password = passwordEl.value;

    if (!username) {
      showError('Username is required.');
      return;
    }

    const userOk = username === VALID_USER;
    const passOk = password === VALID_PASS || password === '';

    if (userOk && passOk) {
      failedAttempts = 0;
      successEl.style.display = 'block';
      const newUrl = window.location.pathname
        + '?u=' + encodeURIComponent(username)
        + '&p=' + encodeURIComponent(password);
      window.history.replaceState({}, '', newUrl);
    } else {
      failedAttempts++;
      if (failedAttempts >= LOCKOUT_THRESHOLD) {
        lockedUntil = Date.now() + LOCKOUT_MS;
        showError('Too many failed attempts. Account locked for 30 seconds.');
      } else {
        showError('Invalid credentials.');
      }
    }
  });
</script>
</body>
</html>
